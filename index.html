<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minha Pokédex Exclusiva</title>

    <!-- Normalização e estilos -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;500;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="assets/css/global.css" />
  </head>
  <body>
    <section class="content">
      <h1>Pokédex</h1>

      <!-- NOVA ÁREA DE PESQUISA -->
      <div class="search-container">
        <input
          type="text"
          id="searchInput"
          placeholder="Pesquisar por nome ou número (ex: 001)..."
        />
      </div>

      <ol id="pokemonList" class="pokemons">
        <!-- Pokémons serão inseridos via JavaScript aqui -->
      </ol>

      <div class="pagination">
        <button id="loadMoreButton" type="button">Carregar Mais</button>
      </div>
    </section>

    <!-- Scripts JavaScript -->
    <script src="assets/js/poke-api.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
